name: Update EPG

on:
  schedule:
    - cron: '0 3 * * *'   # every day at 03:00 UTC
  workflow_dispatch:       # adds a "Run workflow" button

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: epg
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download the iptv-org grabber
        run: git clone --depth 1 -b master https://github.com/iptv-org/epg.git epg

      - name: Install
        working-directory: epg
        run: npm install

      - name: Grab listings
        working-directory: epg
        run: |
          mkdir -p "$GITHUB_WORKSPACE/public"
          npm run grab --- \
            --channels="$GITHUB_WORKSPACE/english.channels.xml" \
            --output="$GITHUB_WORKSPACE/public/guide.xml" \
            --gzip="$GITHUB_WORKSPACE/public/guide.xml.gz" \
            --days=3 \
            --maxConnections=10

      - name: Add a simple index page
        run: |
          echo '<!doctype html><title>EPG</title><p><a href="guide.xml">guide.xml</a> | <a href="guide.xml.gz">guide.xml.gz</a></p>' > public/index.html
          ls -lh public

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
